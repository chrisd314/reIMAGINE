# Lesson codebook, version 1 (frozen 2026-11-11, before any version was coded).
#
# One row per story version. The coder reads the version as printed and answers six questions.
# The same codebook is used by the machine coder, by the human coding sheet on the website
# and by the Aesop hidden-moral check.
version: 1

fields:
  outcome:
    question: "How does the story end for the character whose conduct the story is about?"
    values:
      wrongdoer_punished: "A character who did wrong (cruelty, deceit, greed, ingratitude, pride) comes to harm or is exposed."
      virtue_rewarded: "A character who did right (kindness, loyalty, honesty, patience, piety) is rewarded, saved or vindicated."
      wit_wins: "A character gets out of danger, or gets the better of someone, by cleverness or a trick."
      folly_costs: "A character loses out through foolishness, rashness, credulity or daydreaming, without doing wrong."
      innocent_suffers: "Harm falls on someone who did not deserve it and is not made good."
      open: "No one clearly wins or loses; the story ends on a saying, an explanation or a stand-off."

  behaviour:
    question: "Which conduct does this version teach? Use its own stated moral, application or frame if it has one; otherwise infer it from the story. One primary code."
    values:
      prudence: "Think ahead; be cautious; take good advice; do not trust the untrustworthy; do not count on what you do not yet have."
      gratitude: "Repay kindness; honour those who helped or raised you (includes care for aged parents). Negative example: ingratitude."
      honesty: "Tell the truth, keep your word, deal fairly. Negative example: lying, fraud, false accusation."
      contentment: "Be satisfied with enough; moderation. Negative example: greed, avarice, envy."
      humility: "Know your limits and your place. Negative example: pride, vanity, boasting, overreaching."
      justice: "Judge fairly and wisely; give each their due; rulers and judges owe justice."
      fidelity: "Faithfulness in marriage or love; chastity; loyalty to a spouse, master or friend."
      compassion: "Be kind, generous and merciful to others, including animals and strangers. Negative example: cruelty."
      cleverness: "Wit and resourcefulness are admired and win the day; the weak can outsmart the strong."
      piety: "Trust in God or the Dharma; devotion, repentance, renunciation of the world; resist the devil or temptation."
      restraint: "Hold your tongue and your temper; do not gossip, quarrel or act in anger."
      diligence: "Work, persevere, use small beginnings well. Negative example: laziness."
      acceptance: "Accept what cannot be changed: age, death, one's nature, one's lot."
      tolerance: "No one holds the whole truth; do not judge or quarrel over partial views."
      none: "No lesson can be identified (pure entertainment, an origin story, a jest with no point of conduct)."

  story_behaviour:
    question: "Read the narrative alone and ignore any stated moral, application, frame or verse. Which conduct does the story itself teach? Same codes as `behaviour`."
    values: same_as_behaviour

  mode:
    question: "Does the version teach by showing the conduct rewarded, or its opposite punished?"
    values:
      positive: "The good conduct is shown and pays off."
      negative: "The bad conduct is shown and is punished or mocked (a cautionary tale)."
      both: "Both are shown side by side."
      na: "No lesson."

  justification:
    question: "Why, according to this version, should one behave that way? Code the reason the text itself gives."
    values:
      worldly: "It pays or costs you in this life: practical consequences to yourself."
      social: "Others will repay, honour, shame or punish you: reciprocity, reputation, law, social order."
      divine: "God, providence, sin and salvation, heaven and hell, the devil; includes allegorical applications to the soul."
      karmic: "Karma, merit, rebirth, the Bodhisatta's perfections, enlightenment or liberation."
      none: "The version gives no reason; it only shows what happened."

  lesson_place:
    question: "Where is the lesson stated?"
    values:
      narrator: "By the narrator inside or right after the story (a closing moral)."
      character: "By a character in the story (a speech, a verse, a rebuke)."
      frame: "In a frame, application or moralisation set apart from the story."
      not_stated: "Nowhere; the coder inferred it."

  confidence:
    question: "How sure are you of the behaviour code? 1 = a guess, 2 = fairly sure, 3 = clear."
    values: [1, 2, 3]

  lesson_text:
    question: "The lesson in your own words, as one plain sentence of at most 15 words."

  quote:
    question: "The words of the text that state or best support the lesson: at most 25 words, copied exactly."

derived:
  doctrinal_justification: "justification in {divine, karmic}"
  lesson_match: "two versions have the same `behaviour` code (pairs with a `none` code never match)"
  outcome_match: "two versions have the same `outcome` code"
