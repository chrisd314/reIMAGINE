[project]
name = "reimagine"
version = "1.0.0"
description = "reIMAGINE: a text-similarity network of folktales, the religious parables placed on it, and the website that shows both."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "CC BY-NC-SA 4.0, see LICENSE and LICENSE_NOTES.md" }
authors = [
  { name = "Christos Diamantis" },
  { name = "Dávid Weiner" },
  { name = "Evangelos Panagiotopoulos" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "networkx>=3.4",
  "pyyaml>=6",
  "requests>=2.31",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "ftfy>=6.2",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.45"]
spacy = [
    "en-core-web-sm",
    "spacy>=3.8,<3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reimagine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
