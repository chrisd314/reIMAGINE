[project]
name = "once-upon-a-world"
version = "1.0.0"
description = "Folktale text-similarity networks compared with ATU tale types and recorded provenance (DTU 02805 course project)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Code licence to be decided by the authors; data terms in LICENSE_NOTES.md" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "networkx>=3.4",
  "pyyaml>=6",
  "requests>=2.31",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "matplotlib>=3.8",
  "ftfy>=6.2",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
