# Settings of every analysis stage (python -m reimagine.run).
# Text and graph settings shared by all stages are read from config.yaml:
#   lexical.* (TF-IDF, negations kept), semantic.* (MiniLM, 200-token chunks),
#   graphs.densities, graphs.primary_density, graphs.seeds, graphs.primary_seed, graphs.louvain_resolution.
# Every judgement call behind a value here is logged in ai-assist/DECISIONS.md.

seed: 0                                    # sampling, bootstrap, development sample
calibration_list: data/mappings/calibration_set.csv
calibration_exclusion:
  max_cosine: 0.9                          # a pool folktale above this cosine to a retelling (either representation) is a near-copy

representations: [tfidf, embedding]
primary_representation: tfidf              # the main representation, fixed at the calibration gate (ai-assist/DECISIONS.md)

map:
  modularity_null:
    shuffles: 100                          # at the primary density
    shuffles_other_densities: 20
    swaps_per_edge: 10
    seed: 2026
  label_shuffles: 1000
  label_shuffle_seed: 20261111
  top_words: 10
  lda: {max_iter: 30, max_features: 5000, seed: 0}
  backbone: {alpha: 0.05, min_mean_degree: 1.0, fallback_k: 5}
  layout_seed: 42
  layout_iterations: 300                   # ForceAtlas2 on the whole graph, positions for drawing only
  pagerank_top: 10

community_names:                           # names of the nine large communities of the main TF-IDF network (10% density,
                                           # Louvain seed 42), read from each one's dominant tale types and most distinctive
                                           # words. Each name is checked against the first top word of its community, so a
                                           # changed partition stops the network stage instead of mislabelling a community.
  C1: {name: "Royal wonder tales", first_word: king}
  C2: {name: "Animal fables", first_word: fox}
  C3: {name: "Domestic & trickster", first_word: money}
  C4: {name: "Household & youth", first_word: girl}
  C5: {name: "Devil & supernatural", first_word: bridge}
  C6: {name: "Family & moral fate", first_word: son}
  C7: {name: "Archaic-register tales", first_word: parrot}
  C8: {name: "Insect & nature fables", first_word: grasshopper}
  C9: {name: "Satirical & monkey fables", first_word: monkey}

parables:
  user_agent: "OnceUponAWorld/1.0 (DTU 02805 student project, one request per second)"
  seconds_between_requests: 1.0
  duplicate_cosine: 0.9                    # TF-IDF cosine to a calibration version above which a new story is dropped
  min_tokens: 40                           # shorter segments are not parables (cross-references, stubs)
  max_tokens: 3000
  baseline_per_tradition: 40
  targets: {christian: all, buddhist_jataka: 72, jewish: 60, sufi: 60, taoist: 50}

partB:
  closeness_k: 5
  attach_k: 10
  bootstrap: 10000

headline:                                  # parables against the baseline of their own tradition
  permutations: 1000                       # parable/baseline label shuffled within the tradition (text = unit)
  seed: 20261118

vocab:                                     # nouns masked (spaCy en_core_web_sm, installed by `uv sync --group spacy`)
  placeholder: "[N]"                       # replaces nouns and proper nouns. One letter, so the TF-IDF tokenizer ignores it
  noun_share: 0.5                          # a word is a noun if tagged NOUN/PROPN in at least half of its uses
  driver_terms: 5                          # terms contributing most to a top-1 cosine
  summary_terms: 10

length:                                    # length-matched folktale excerpts, regression
  excerpts_per_text: 5                     # contiguous excerpts from random folktales per parable or baseline passage
  tolerance: 0.10                          # excerpt length within 10% of the text's (eligible tales: at least 90% as long)
  seed: 20261119
  matching_alpha: 0.05                     # baseline counts as length-matched if Mann-Whitney p >= this

network:                                   # edge constructions, backbones, structure, source-collection nulls
  knn: [5, 10, 20]                         # symmetrised k-nearest-neighbour graphs, next to the densities of config.yaml
  knn_modularity_shuffles: 20              # degree-preserving shuffles per kNN graph
  backbone_alphas: [0.05, 0.01]            # disparity filter, for drawing only
  backbone_drawn_from: complete similarity graph
  backbone_drawn_alpha: 0.01               # alpha 0.05 keeps too many edges to draw without a hairball (ai-assist/DECISIONS.md A8)
  clustering_shuffles: 20                  # the first 20 shuffles of the Part A modularity null (same seed and stream)
  random_graphs: 20                        # G(n, m) graphs for the degree distribution
  structure_seed: 20261120

robustness:                                # the table of checks, verdict rule in reimagine/robustness.py
  collection_dominance: 0.25               # a tradition's neighbours are "dominated" by a collection above this share of links

checks:
  recall_k: 10
  vote_chance_draws: 1000                  # random 10-folktale draws per query for the chance level of the type vote
  hubs_removed: 10

masking:
  placeholder: ""                          # masked words are removed. A visible token such as "X" would itself be shared
                                           # by every text with names and raise embedding similarity (ai-assist/DECISIONS.md)
  name_threshold: 0.5                      # word capitalised in more than half of its uses (course week 6)
  formulae:                                # story openings and scriptural formulae, replaced before names
    - 'when Brahmadatta was (?:reigning|king) in Benares'
    - 'Once (?:up)?on a time'
    - 'There (?:was|lived) once(?: upon a time)?'
    - 'Once there (?:was|were|lived)'
    - '(?:Most certainly|Most assuredly|Verily),? I (?:tell|say un?to) (?:you|thee)'
    - 'He who has ears(?: to hear)?, let him hear'
    - 'The Kingdom of (?:Heaven|God) is like'
    - 'He spoke (?:another|this|a) parable(?: to them)?,? saying'
    - 'the Holy One,? blessed be He'
    - 'blessed be He'
    - 'as it is (?:written|said)'
    - 'lived happily ever after'
  translator_formulae:                     # translator and editor formulae found in the folktale texts
    # (5-word phrases in 3+ tales, at least 60% of them from one source collection, ai-assist/DECISIONS.md R8)
    - 'In a certain place there lived'     # Panchatantra opening (Benfey's German, Ashliman's English), 5 tales
    - "Kinder- und Hausm\\w*rchen \\(Children's and Household Tales -- Grimms' Fairy Tales\\)(?:, no\\. \\d+)?"
    - "One of India's most influential contributions to world literature, The Panchatantra[^.]*?centuries AD\\."
    - 'It is believed that even then the stories were already ancient\.'
    - "The tales' self-proclaimed purpose is to educate the sons of royalty\\."
    - "Although the original author's or compiler's name is unknown, [^']*'court scholar\\.'"
    - 'The fables of The Panchatantra found their way to Europe[^.]*\.'
    - 'They substantially influenced medieval writers of fables\.'
