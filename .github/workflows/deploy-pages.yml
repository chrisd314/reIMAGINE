# Builds the public website and deploys it to GitHub Pages.
#
# The site reads three committed files in data/site/ (story.json, network.json, near.json), written by the
# pipeline (python -m reimagine.run --stage site). The workflow therefore does not rerun the analysis: it checks
# that they hold only openings of at most 40 words (LICENSE_NOTES.md), builds web/ and publishes web/dist.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "data/site/**"
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to publish full texts
        run: |
          python3 - <<'EOF'
          import json, pathlib, sys

          def openings(obj, key=""):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      yield from openings(v, key if "opening" in key.lower() else k)
              elif isinstance(obj, list):
                  for v in obj:
                      yield from openings(v, key)
              elif isinstance(obj, str) and "opening" in key.lower():
                  yield obj

          limit = json.load(open("data/site/story.json", encoding="utf-8"))["settings"]["openingWords"]
          texts = [o for f in sorted(pathlib.Path("data/site").glob("*.json"))
                   for o in openings(json.loads(f.read_text(encoding="utf-8")))]
          longest = max(len(t.replace(" …", "").split()) for t in texts)
          print(f"{len(texts)} openings, the longest has {longest} words (limit {limit})")
          if longest > limit:
              sys.exit("an opening is longer than the excerpt limit, so the site is not deployed")
          EOF

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the website
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
